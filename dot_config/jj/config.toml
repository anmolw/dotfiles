"$schema" = "https://jj-vcs.github.io/jj/latest/config-schema.json"

[user]
email = "4815989+anmolw@users.noreply.github.com"
name = "anmolw"

[aliases]
fetch = ["git", "fetch"]
l = ["log"]
la = ["log", "-r", "::"]
push = ["git", "push"]
s = ["status"]

[git]
sign-on-push = true

[signing]
backend = "ssh"
key = "ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAINhjKonstq1xifZcoYcPkaqZmD6hOLMRdzq7xfhFrPLm"
behavior = "drop"

[template-aliases]
"format_short_signature(signature)" = """   coalesce(signature.name(), name_placeholder)"""
"format_short_commit_header(commit)" = """
separate(" ",
    format_short_change_id_with_change_offset(commit),
    if(commit.signature(), "", ""),
    format_short_signature(commit.author()),
    format_timestamp(commit_timestamp(commit)),
    commit.bookmarks(),
    commit.tags(),
    commit.working_copies(),
    if(commit.contained_in('first_parent(@)'), label("git_head", "git_head()")),
    format_short_commit_id(commit.commit_id()),
    if(commit.conflict(), label("conflict", "conflict")),
    if(config("ui.show-cryptographic-signatures").as_boolean(),
        format_short_cryptographic_signature(commit.signature())),
)
"""

[ui]
default-command = "log"
pager = ["delta"]
diff-formatter = ":git"

[merge-tools.delta]
diff-args = ["$left", "$right"]
diff-expected-exit-codes = [0, 1]
